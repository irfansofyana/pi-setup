name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: minimum
            node: 22.19.0
            pi: 1.0.0
          - profile: pinned
            node: 24.18.0
            pi: 1.1.0
          - profile: current
            node: 24.18.0
            pi: 1.3.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install and test sequentially under hard limits (no Chrome)
        run: |
          container="pi-test-${{ strategy.job-index }}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=15s 16m docker run --name "$container" --rm --init \
            --memory=2g --memory-swap=2g --cpus=2 --pids-limit=128 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --tmpfs /work:rw,exec,size=1g --workdir /work \
            -e PI_VERSION=${{ matrix.pi }} -e NODE_OPTIONS=--max-old-space-size=512 \
            node:${{ matrix.node }}-bookworm-slim timeout --kill-after=10s 15m sh -eu -c '
              cp -a /source/. /work/
              npm ci --no-audit --no-fund
              npm install --no-save --ignore-scripts --no-audit --no-fund \
                @earendil-works/pi-coding-agent@$PI_VERSION \
                @earendil-works/pi-ai@$PI_VERSION @earendil-works/pi-tui@$PI_VERSION
              npm run test:ci
            '
